<!doctype html>
<html lang="es-EC">
  <head>
    <meta charset="UTF-8" />

    <!--
      viewport-fit=cover es lo que habilita env(safe-area-inset-*). Sin
      esto, la barra de navegación queda debajo de la barra de gestos de
      iOS y no se puede tocar.
      maximum-scale se deja libre a propósito: bloquear el zoom rompe la
      accesibilidad. El zoom al enfocar un input se evita con font-size
      de 16px, no capando el gesto.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Un theme-color por esquema: la barra del navegador acompaña al
         papel de la app en claro y en oscuro. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f7f8f9"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#14181c"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Saldus" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Registro de ingresos y gastos personales que funciona sin conexión."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <title>Saldus</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
