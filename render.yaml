# Despliegue del frontend como sitio estático en Render.
#
# Está versionado a propósito, en vez de configurarlo a mano en el panel:
# así el despliegue se revisa en un diff como cualquier otro cambio.
#
# Por qué Render y no Netlify o Cloudflare Pages: CLAUDE.md §2 ya
# comprometió Render para el backend de la Fase 2, y tener las dos piezas
# en la misma cuenta ahorra un proveedor. Los tres habrían servido igual
# para un SPA estático.
#
# Por qué hace falta desplegar y no basta la red local: un service worker
# exige contexto seguro. Solo `localhost` y HTTPS cuentan; entrar desde el
# teléfono a http://192.168.x.x nunca va a ofrecer instalar la app, por
# muy correcto que esté el manifest.

services:
  - type: web
    name: saldus
    runtime: static

    # Toda la app vive en develop; origin/main solo tiene un README.
    # Sin fijar la rama, Render desplegaria la rama por defecto del
    # repositorio (main) y publicaria un sitio vacio.
    branch: develop

    # Redesplegar en cada push a esa rama. Explicito porque un sitio
    # creado desde el enlace publico de despliegue puede quedarse sin
    # el webhook de GitHub, y entonces no se entera de los commits.
    autoDeploy: true

    # El sitio vive en web/, no en la raíz del repo.
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      # Vite 8 exige Node moderno. Sin fijarlo, el día que Render mueva su
      # versión por defecto el build se rompe sin que nadie haya tocado nada.
      - key: NODE_VERSION
        value: "24"

    # La app es un SPA: cualquier ruta profunda tiene que servir el index.
    # El caso concreto que se rompe sin esto es el atajo /registrar del
    # manifest, que es justo el que se abre desde la pantalla de inicio.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # El service worker no se puede cachear. Si el navegador sirve un
      # sw.js viejo, la app se queda clavada en una versión antigua y el
      # aviso de "hay una versión nueva" no llega jamás.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
